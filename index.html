      --shadow: 0 4px 24px rgba(12, 140, 233, 0.12);

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: linear-gradient(160deg, var(--blue-50) 0%, #fff 45%, var(--blue-100) 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 48px;
      line-height: 1.5;
    }
    .container {
      width: 100%;
      max-width: 560px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    header { text-align: center; padding: 12px 0 8px; }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--blue-600);
      letter-spacing: -0.02em;
    }
    .subtitle {
      font-size: 0.9rem;
      color: var(--text-light);
      margin-top: 6px;
    }
    .card {
      background: var(--white);
      border-radius: 16px;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .counter {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--blue-600);
      text-align: center;
      padding: 10px 16px;
      background: var(--blue-50);
      border-radius: 10px;
      border: 1px solid var(--blue-200);
    }
    .preview-label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-light);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .preview {
      background: var(--blue-50);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      min-height: 120px;
      white-space: pre-wrap;
      font-size: 0.95rem;
      color: var(--text);
      line-height: 1.55;
      word-break: break-word;
    }
    .preview.empty {
      color: var(--text-light);
      font-style: italic;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    button {
      appearance: none;
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
      width: 100%;
    }
    button:active { transform: scale(0.98); }
    .btn-primary {
      background: var(--blue-500);
      color: var(--white);
      box-shadow: 0 4px 14px rgba(12, 140, 233, 0.35);
    }
    .btn-primary:hover { background: var(--blue-600); }
    .btn-primary:disabled {
      background: var(--blue-300);
      cursor: not-allowed;
      box-shadow: none;
    }
    .btn-secondary {
      background: var(--white);
      color: var(--blue-600);
      border: 2px solid var(--blue-300);
    }
    .btn-secondary:hover {
      background: var(--blue-50);
      border-color: var(--blue-400);
    }
    .btn-secondary:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .hint {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-light);
      padding: 8px 12px;
      background: var(--blue-50);
      border-radius: 8px;
    }
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--blue-700);
      color: var(--white);
      padding: 12px 24px;
      border-radius: 10px;
      font-size: 0.95rem;
      font-weight: 500;
      opacity: 0;
      transition: transform 0.25s ease, opacity 0.25s ease;
      z-index: 100;
      pointer-events: none;
      box-shadow: 0 6px 20px rgba(0,0,0,0.18);
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
    footer {
      margin-top: 12px;
      font-size: 0.8rem;
      color: var(--text-light);
      text-align: center;
    }
    @media (min-width: 480px) {
      h1 { font-size: 2rem; }
      .actions { flex-direction: row; }
      .actions button { flex: 1; }
    }
  </style>
</head>

      const LANG_KEYS = Object.keys(LANGS);
      const THEME_KEYS = ['visual', 'handsome', 'coolVibe', 'outfit', 'product', 'thanks'];

      function pick(arr) {
        return arr[Math.floor(Math.random() * arr.length)];
      }

      function generateCommentBody() {
        const lang = pick(LANG_KEYS);
        const theme = pick(THEME_KEYS);
        let body = pick(LANGS[lang][theme]);

        body = body.replace(/\s+/g, ' ').trim();
        if (['en', 'es', 'id'].includes(lang) && body.length > 0) {
          body = body.charAt(0).toUpperCase() + body.slice(1);
        }
        if (!/[.!?。！？]$/.test(body)) {
          body += (['zh', 'ja'].includes(lang) ? '。' : '.');
        }

        if (body.length > MAX_BODY) {
          body = body.slice(0, MAX_BODY - 1).trim();
          if (!/[.!?。！？]$/.test(body)) {
            body += (['zh', 'ja'].includes(lang) ? '。' : '.');
          }
        }
        return body;
      }

      function formatFullComment(body) {
        return body + FIXED_SUFFIX;
      }

      const STORAGE_KEY = 'xcg_perth_loreal_hair_v1';
      let state = { count: 0, history: [] };

      function loadState() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (typeof parsed.count === 'number' && Array.isArray(parsed.history)) {
              state = parsed;
            }
          }
        } catch (e) {}
      }

      function saveState() {
        try {
          if (state.history.length > 3000) {
            state.history = state.history.slice(-3000);
          }
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        } catch (e) {}
      }

      let lastFullComment = null;

      function updateUI() {
        document.getElementById('counter').textContent = `Đã copy: ${state.count} comment`;
        const preview = document.getElementById('preview');
        if (lastFullComment) {
          preview.textContent = lastFullComment;
          preview.classList.remove('empty');
          document.getElementById('btnPost').disabled = false;
        }
      }

      function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => toast.classList.remove('show'), 1800);
      }

      function generateUnique() {
        for (let i = 0; i < 200; i++) {
          const body = generateCommentBody();
          if (!state.history.includes(body)) return body;
        }
        return generateCommentBody();
      }

      async function generateAndCopy(alsoPost) {
        const body = generateUnique();
        const full = formatFullComment(body);

        try {
          await navigator.clipboard.writeText(full);
        } catch (err) {
          const ta = document.createElement('textarea');
          ta.value = full;
          ta.style.position = 'fixed';
          ta.style.left = '-9999px';
          document.body.appendChild(ta);
          ta.select();
          try { document.execCommand('copy'); }
          catch (e2) {
            showToast('Copy failed. Please copy manually.');
            lastFullComment = full;
            updateUI();
            return;
          }
          document.body.removeChild(ta);
        }

        lastFullComment = full;
        state.count += 1;
        state.history.push(body);
        saveState();
        updateUI();
        showToast(alsoPost ? 'Copied & opening X' : 'Comment copied');

        if (alsoPost) {
          setTimeout(() => {
            const url = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(full);
            window.open(url, '_blank', 'noopener,noreferrer');
          }, 300);
        }
      }

      document.getElementById('btnGenerate').addEventListener('click', () => generateAndCopy(false));
      document.getElementById('btnPost').addEventListener('click', () => generateAndCopy(true));

      document.addEventListener('keydown', (e) => {
        if (e.code === 'Space' && e.target === document.body) {
          e.preventDefault();
          generateAndCopy(true);
        }
      });

      loadState();
      updateUI();
    })();
